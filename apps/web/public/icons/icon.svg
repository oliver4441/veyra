<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0bcff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a078ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="180" fill="url(#play)" opacity="0.1"/>
  
  <!-- Play button circle -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#play)" stroke-width="8" opacity="0.3"/>
  
  <!-- Play triangle -->
  <path d="M220 180 L340 256 L220 332 Z" fill="url(#play)"/>
  
  <!-- V letter -->
  <text x="256" y="440" font-family="Plus Jakarta Sans, sans-serif" font-size="72" font-weight="800" fill="#d0bcff" text-anchor="middle" opacity="0.8">V</text>
</svg>

</div></button><button class="text-left px-3 py-2 text-body-md font-body-md text-on-surface hover:bg-surface-variant rounded">Auto</button>

<!-- Hidden Navigation (Suppressed on video player) -->
<!-- SideNavBar / BottomNavBar excluded based on rules -->
<script>
        // Simple UI fade interaction
        let timeout;
        const uiContainer = document.getElementById('video-ui');

        function resetFadeTimer() {
            uiContainer.classList.remove('ui-hidden');
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                uiContainer.classList.add('ui-hidden');
            }, 3000); // Fade after 3 seconds of inactivity
        }

        document.addEventListener('mousemove', resetFadeTimer);
        document.addEventListener('touchstart', resetFadeTimer);
        
        // Initial setup
        resetFadeTimer();
    </script>

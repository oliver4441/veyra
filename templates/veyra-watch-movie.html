<script>
        // Simulate Loading State
        document.addEventListener("DOMContentLoaded", () => {
            const loadingOverlay = document.getElementById('loading-overlay');
            setTimeout(() => {
                loadingOverlay.classList.add('hide');
            }, 2000); // 2 second mock load
        });

        // Auto-hide UI logic (simplified)
        const uiContainer = document.getElementById('player-ui');
        const videoContainer = document.getElementById('video-container');
        let hideTimeout;

        function showUI() {
            uiContainer.classList.remove('fade-out');
            videoContainer.classList.remove('cursor-none');
            clearTimeout(hideTimeout);
            
            // Re-hide after 3 seconds of inactivity
            hideTimeout = setTimeout(() => {
                // Don't hide if interacting with menus (simplified check)
                uiContainer.classList.add('fade-out');
                videoContainer.classList.add('cursor-none');
            }, 3000);
        }

        // Listen for mouse movement to wake up UI
        videoContainer.addEventListener('mousemove', showUI);
        videoContainer.addEventListener('click', showUI);
        
        // Initial setup
        showUI();
    </script>

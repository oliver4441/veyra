<style>
        body {
            background-color: #0A0A0B; /* Level 0 Base */
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
        }
        
        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(20, 20, 22, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-input {
            background-color: #1c1c1e;
            border: 1px solid transparent;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            border-bottom-color: theme('colors.primary');
            box-shadow: 0 4px 12px rgba(208, 188, 255, 0.1);
            outline: none;
        }

        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
<!-- SideNavBar (Shared Component) -->
<nav class="hidden md:flex flex-col h-screen w-64 bg-surface-container-low border-r border-white/5 shadow-sm p-6 space-y-4 shrink-0">
<div class="flex items-center space-x-3 mb-8">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<div>
<h1 class="font-headline-md text-headline-md font-extrabold text-primary tracking-tight">Veyra Admin</h1>
<p class="font-label-caps text-[10px] text-on-surface-variant tracking-wider uppercase">System Controller</p>
</div>
</div>
<button class="w-full py-3 px-4 rounded-lg bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold shadow-[0_0_15px_rgba(208,188,255,0.3)] hover:shadow-[0_0_25px_rgba(208,188,255,0.5)] transition-all flex items-center justify-center space-x-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">upload</span>
<span>Upload Content</span>
</button>
<div class="flex-1 space-y-2 mt-6">
<a class="flex items-center space-x-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-body-md text-body-md">Dashboard</span>
</a>
<a class="flex items-center space-x-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-lg font-bold shadow-sm transition-all scale-[0.98]" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">movie</span>
<span class="font-body-md text-body-md">Content</span>
</a>
<a class="flex items-center space-x-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-body-md text-body-md">Users</span>
</a>
<a class="flex items-center space-x-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all" href="#">
<span class="material-symbols-outlined">monitoring</span>
<span class="font-body-md text-body-md">Analytics</span>
</a>
<a class="flex items-center space-x-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-body-md text-body-md">Settings</span>
</a>
</div>
<div class="mt-auto pt-6 border-t border-white/10">
<a class="flex items-center space-x-3 px-4 py-3 text-on-surface-variant hover:bg-error/20 hover:text-error rounded-lg transition-all" href="#">
<span class="material-symbols-outlined">logout</span>
<span class="font-body-md text-body-md">Logout</span>
</a>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col h-full overflow-y-auto bg-background relative">
<!-- TopAppBar Context (Mobile mostly, hidden on desktop if side nav is present, but kept for responsive structure) -->
<header class="md:hidden glass-panel sticky top-0 z-40 w-full px-4 py-4 flex justify-between items-center border-b border-white/10">
<h1 class="font-headline-md text-headline-md font-bold tracking-tighter text-primary">Veyra</h1>
<button class="text-on-surface"><span class="material-symbols-outlined">menu</span></button>
</header>
<!-- Page Content -->
<div class="max-w-[container-max] w-full mx-auto px-grid-margin-mobile md:px-grid-margin-desktop py-8 md:py-12 flex flex-col gap-content-gap">
<!-- Page Header & Stepper -->
<div class="mb-8">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Upload Movie</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-10">Step 2 of 5: Metadata Entry</p>
<!-- Stepper UI -->
<div class="relative flex items-center justify-between w-full max-w-4xl mx-auto">
<!-- Line behind steps -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[2px] bg-surface-variant -z-10"></div>
<!-- Step 1 (Completed) -->
<div class="flex flex-col items-center gap-2 z-10 bg-background px-2">
<div class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_0_15px_rgba(208,188,255,0.4)]">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface hidden md:block">Select Video</span>
</div>
<!-- Step 2 (Active) -->
<div class="flex flex-col items-center gap-2 z-10 bg-background px-2">
<div class="w-10 h-10 rounded-full border-2 border-primary bg-surface flex items-center justify-center shadow-[0_0_20px_rgba(208,188,255,0.2)]">
<span class="font-body-md text-body-md font-bold text-primary">2</span>
</div>
<span class="font-label-caps text-label-caps text-primary font-bold hidden md:block">Information</span>
</div>
<!-- Step 3 (Pending) -->
<div class="flex flex-col items-center gap-2 z-10 bg-background px-2">
<div class="w-10 h-10 rounded-full border-2 border-surface-variant bg-surface flex items-center justify-center text-on-surface-variant">
<span class="font-body-md text-body-md">3</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden md:block">Artwork</span>
</div>
<!-- Step 4 (Pending) -->
<div class="flex flex-col items-center gap-2 z-10 bg-background px-2">
<div class="w-10 h-10 rounded-full border-2 border-surface-variant bg-surface flex items-center justify-center text-on-surface-variant">
<span class="font-body-md text-body-md">4</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden md:block">Settings</span>
</div>
<!-- Step 5 (Pending) -->
<div class="flex flex-col items-center gap-2 z-10 bg-background px-2">
<div class="w-10 h-10 rounded-full border-2 border-surface-variant bg-surface flex items-center justify-center text-on-surface-variant">
<span class="font-body-md text-body-md">5</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden md:block">Review</span>
</div>
</div>
</div>
<!-- Form Canvas -->
<div class="glass-panel rounded-2xl p-6 md:p-10 shadow-[0px_24px_48px_rgba(0,0,0,0.5)] max-w-4xl mx-auto w-full">
<form class="flex flex-col gap-6">
<!-- Title & Year Row -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-6">
<div class="md:col-span-3 flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="title">Movie Title</label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface" id="title" placeholder="e.g. Interstellar" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="year">Release Year</label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface" id="year" placeholder="YYYY" type="number"/>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="description">Synopsis</label>
<textarea class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface resize-none" id="description" placeholder="Enter a compelling description..." rows="4"></textarea>
</div>
<!-- Genre & Director Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Genres</label>
<!-- Fake Multi-select visually -->
<div class="glass-input w-full rounded-lg px-4 py-3 flex flex-wrap gap-2 items-center cursor-pointer min-h-[50px]">
<span class="bg-surface-variant text-on-surface font-label-caps text-[10px] px-3 py-1 rounded-full flex items-center gap-1">Sci-Fi <span class="material-symbols-outlined text-[14px] hover:text-primary">close</span></span>
<span class="bg-surface-variant text-on-surface font-label-caps text-[10px] px-3 py-1 rounded-full flex items-center gap-1">Action <span class="material-symbols-outlined text-[14px] hover:text-primary">close</span></span>
<input class="bg-transparent border-none outline-none flex-1 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 p-0" placeholder="Type to add..." type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="director">Director</label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface" id="director" placeholder="Director Name" type="text"/>
</div>
</div>
<!-- Cast -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="cast">Lead Cast</label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface" id="cast" placeholder="Comma separated list of actors" type="text"/>
</div>
<!-- Actions Footer -->
<div class="mt-8 pt-6 border-t border-white/10 flex justify-between items-center">
<button class="px-6 py-3 rounded-lg border border-white/20 text-on-surface font-body-md font-semibold hover:bg-white/5 transition-colors flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                            Back
                        </button>
<button class="px-8 py-3 rounded-lg bg-gradient-to-r from-primary to-primary-container text-on-primary font-body-md font-bold shadow-[0_0_15px_rgba(208,188,255,0.3)] hover:shadow-[0_0_25px_rgba(208,188,255,0.5)] transition-all flex items-center gap-2" type="button">
                            Next Step
                            <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
</main>
</body></html>
